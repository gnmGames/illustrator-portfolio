<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUNGON KIM — Illustration Portfolio</title>
<meta name="description" content="일러스트레이터 포트폴리오">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="grain" aria-hidden="true"></div>
<div class="cursor-dot" id="cursorDot" aria-hidden="true"></div>

<header class="topbar">
  <a href="#top" class="topbar__brand" id="brandName" data-field="siteName">JUNGON KIM</a>
  <nav class="topbar__nav">
    <button class="topbar__link" id="worksLink" type="button">Works</button>
    <button class="edit-toggle" id="editToggle" type="button">편집하기</button>
  </nav>
</header>

<main id="top">

  <section class="stage" id="stage">
    <div class="stage__media" id="stageMedia">
      <img class="stage__image" id="stageImage" src="" alt="" draggable="false">
    </div>
    <div class="stage__scrim" aria-hidden="true"></div>

    <div class="stage__cover" id="stageCover">
      <p class="stage__eyebrow">ILLUSTRATION PORTFOLIO</p>
      <h1 class="stage__tagline" id="coverTagline" data-field="tagline" data-placeholder="한 줄 소개를 입력하세요">캐릭터에 생명을 그려 넣습니다.</h1>
      <button class="stage__scrollcue" id="scrollCue" type="button" aria-label="작품 보러가기">
        <span>Scroll</span>
        <i></i>
      </button>
    </div>

    <aside class="stage__panel" id="stagePanel">
      <button class="stage__close" id="stageClose" type="button" aria-label="닫기">✕</button>
      <p class="stage__count"><span id="panelIndex">01</span><i>/</i><span id="panelTotal">28</span></p>
      <p class="stage__field stage__category" id="panelCategory" data-placeholder="카테고리 (예: 캐릭터, 배경)"></p>
      <h2 class="stage__field stage__piece-title" id="panelTitle" data-placeholder="제목을 입력하세요"></h2>
      <p class="stage__field stage__year" id="panelYear" data-placeholder="연도"></p>
      <p class="stage__field stage__desc" id="panelDesc" data-placeholder="이 작품에 대한 설명을 입력하세요."></p>

      <div class="stage__edit-actions" id="stageEditActions">
        <button id="cropEditBtn" type="button">썸네일 편집</button>
        <button id="deleteItemBtn" type="button" class="danger">이 작품 삭제</button>
      </div>

      <div class="crop-controls" id="cropControls">
        <p class="crop-controls__hint">이미지를 드래그해서 썸네일에 보일 부분을 정하세요.</p>
        <div class="crop-controls__row">
          <button id="cropCenterBtn" type="button">가운데로</button>
          <button id="cropCancelBtn" type="button">취소</button>
          <button id="cropApplyBtn" type="button" class="primary">적용</button>
        </div>
      </div>

      <div class="stage__nav">
        <button id="prevBtn" type="button">← Prev</button>
        <button id="nextBtn" type="button">Next →</button>
      </div>
    </aside>

    <div class="crop-overlay" id="cropOverlay">
      <div class="crop-box" id="cropBox"></div>
    </div>

    <button class="stage__arrow stage__arrow--prev" id="arrowPrev" type="button" aria-label="이전 작품"></button>
    <button class="stage__arrow stage__arrow--next" id="arrowNext" type="button" aria-label="다음 작품"></button>
  </section>

  <section class="gallery" id="gallery">
    <div class="gallery__head">
      <h2>Works</h2>
      <p class="gallery__count"><span id="galleryCount">28</span> pieces</p>
    </div>
    <p class="edit-hint" id="editHint">편집 모드입니다 — 카드를 드래그하거나 ◀ ▶ 버튼으로 순서를 바꿀 수 있습니다. 맨 앞 작품이 대문 이미지가 됩니다. 카드를 클릭해 열면 오른쪽 패널에서 제목·설명·썸네일을 편집하거나 삭제할 수 있고, 맨 끝 "+" 칸으로 이미지를 추가할 수 있습니다.</p>
    <div class="grid" id="grid"></div>
    <input type="file" id="fileInput" accept="image/*" multiple hidden>
  </section>

</main>

<footer class="footer">
  <p>© <span id="footYear"></span> <span data-field="siteName2">JUNGON KIM</span></p>
</footer>

<div class="edit-bar" id="editBar">
  <span class="edit-bar__status" id="editStatus">편집 모드 · 변경 사항은 이 브라우저에 자동 저장됩니다</span>
  <div class="edit-bar__actions">
    <button id="exportBtn" type="button">data.js로 내보내기</button>
    <button id="exportImagesBtn" type="button">이미지 파일 내보내기</button>
    <button id="resetBtn" type="button">편집 초기화</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
